version: '2.4'
services:
  gps_logger:
    image: 'yourregistry/ncos_gps_logger:latest'
    container_name: gps_logger
    network_mode: bridge
    volumes:
      - $CONFIG_STORE
    restart: unless-stopped
    # No `logging:` block. The engine attaches the syslog driver with
    # `tag: {{.Name}}` regardless, so a json-file request is silently
    # overridden and implies a driver you do not get. Container output goes to
    # the router log; read it with `log show -i -s gps_logger`.
